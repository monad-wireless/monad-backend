nelmio_api_doc:
    documentation:
        info:
            title: Monad API
            description: Authentication and user management API for Monad application
            version: 1.0.0
        servers:
            - url: http://localhost:8000
              description: Local development server
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: JWT token obtained from POST /api/auth/login
    areas:
        path_patterns:
            - ^/api(?!/doc$)
