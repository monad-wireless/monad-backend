# api.monad.dubec.dev — host nginx vhost in front of the containerised API.
#
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled, then:
#   certbot --nginx -d api.monad.dubec.dev
#
# The container publishes on 127.0.0.1:8080 only (see docker-compose.deploy.yml), so this vhost is
# the single Internet-facing surface — same arrangement the public site already uses on this host.

server {
    listen 80;
    listen [::]:80;
    server_name api.monad.dubec.dev;

    # certbot writes its challenge here; everything else goes to TLS.
    # Same challenge root the working monad.dubec.dev vhost uses.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` rather than the newer `http2 on;` directive: this host runs
    # nginx 1.24.0, where `http2 on;` fails `nginx -t`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.monad.dubec.dev;

    # ssl_certificate lines are managed by certbot.

    # Session artefacts are up to 500 MB (S3Service::MAX_FILE_SIZE) — raised 2026-08-20 from 50 MB
    # to admit large LiDAR mesh.ply / ARWorldMap artefacts from the walk instrument. nginx's 1 MB
    # default would reject an ordinary traffic.tsv with a 413 that never reaches the application.
    client_max_body_size 520m;

    # Uploads stream straight through to object storage; buffering them to disk here would double
    # the write and add latency to exactly the request that is already the slowest.
    proxy_request_buffering off;
    proxy_buffering off;

    # A large artefact can take a while from a phone on a congested uplink. Kept proportional to
    # the size increase above: the original 300s assumed a 50 MB artefact at a minimum sustained
    # 170 KB/s, so 500 MB gets the same floor scaled up, not a fixed guess.
    proxy_read_timeout 3000s;
    proxy_send_timeout 3000s;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Propagate the trace context so a phone upload, this hop and the API span end up on one
        # trace in Tempo rather than three unrelated ones.
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate $http_tracestate;
    }
}
