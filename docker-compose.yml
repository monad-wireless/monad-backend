services:
  postgres:
    image: postgres:16-alpine
    container_name: monad_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monad_network
    healthcheck:
      test:
        ["CMD", "pg_isready", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      timeout: 5s
      retries: 5
      start_period: 60s
      interval: 10s

  symfony:
    build:
      context: ./backend/monad-backend
      dockerfile: Dockerfile
    container_name: monad_symfony
    environment: &symfony_environment
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      # The endpoint is mandatory in S3Service — there is deliberately no fallback, because an
      # empty endpoint used to mean "talk to Amazon". Omitting these two here made every
      # session upload 500 with an env-fallback error that named neither of them.
      HETZNER_S3_ENDPOINT: ${HETZNER_S3_ENDPOINT}
      HETZNER_S3_USE_PATH_STYLE: ${HETZNER_S3_USE_PATH_STYLE:-1}
      HETZNER_S3_REGION: ${HETZNER_S3_REGION:-eu-central-1}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_PRESIGNED_URL_EXPIRY: ${HETZNER_S3_PRESIGNED_URL_EXPIRY:-+15 minutes}
      # IP-149 — the admin's walk figures. Both default to empty, which is a state the admin
      # renders as one sentence rather than an error; set them to point a dev admin at a
      # monad-knowledge web instance serving /internal/ with the same signing key.
      MONAD_WEB_INTERNAL_URL: ${MONAD_WEB_INTERNAL_URL:-}
      MONAD_WALK_FIGURE_KEY: ${MONAD_WALK_FIGURE_KEY:-}
    ports:
      - "${SYMFONY_PORT}:8000"
    volumes:
      - ./backend/monad-backend:/var/www/html
      - symfony_var:/var/www/html/var
    networks:
      - monad_network
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /var/www/html
    command: sh -c "composer install --no-interaction && (php bin/console lexik:jwt:generate-keypair --skip-if-exists || true) && php -S 0.0.0.0:8000 -t public"

  # IP-157 — the Messenger worker (push sends over the `async` Doctrine transport, and the
  # scheduler that runs app:notifications:dispatch-due every minute). Same build, same
  # environment and the same source bind-mount as `symfony`, so it sees the vendor/ that
  # service's `composer install` produced; it waits for that service to be up before starting.
  # Without this container a "send now" writes the inbox rows and leaves every push `queued`.
  worker:
    build:
      context: ./backend/monad-backend
      dockerfile: Dockerfile
    container_name: monad_worker
    environment: *symfony_environment
    volumes:
      - ./backend/monad-backend:/var/www/html
      - symfony_var:/var/www/html/var
    networks:
      - monad_network
    depends_on:
      postgres:
        condition: service_healthy
      symfony:
        condition: service_started
    working_dir: /var/www/html
    entrypoint: ["sh", "-c"]
    command: ["until [ -f vendor/autoload.php ]; do sleep 2; done; exec php bin/console messenger:consume scheduler_default async --time-limit=3600 --memory-limit=256M"]

volumes:
  postgres_data:
  symfony_var:

networks:
  monad_network:
    driver: bridge
